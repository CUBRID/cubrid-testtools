# CUBRID Test Tools - Bisect Workflow Configuration
# This configuration file is used for the JSON/Callback bisect workflow

# ActiveMQ Configuration
activemq_user=admin
activemq_pwd=admin
activemq_url=tcp://localhost:61616

# JSON Request Handler Configuration
json.handler.port=8089

# Git Bisect Configuration
# Path to CUBRID source code repository
cubrid.src.dir=/home/cubrid/cubrid

# Path to shell test cases repository
shell.tc.dir=/home/cubrid/cubrid-testcases-private-ex

# Build arguments for CUBRID
# For debug build: -g ninja -m debug build
# For release build: -g ninja -m release build
cubrid.build.arg=-g ninja -m debug build

# Build directory name (will be created under cubrid.src.dir)
cubrid.build.dir=build_x86_64_debug

# Worker Configuration
# Number of concurrent bisect operations (default: 1)
bisect.worker.threads=1

# Timeout for each bisect operation in minutes (default: 60)
bisect.timeout.minutes=60

# Logging Configuration
log.level=INFO
log.file=/var/log/cubrid-testtools/bisect.log
