# CUBRID install test 대상 목록 (OS x 패키지)
#
# OS를 추가/제거할 때는 이 파일에 os 한 줄만 추가/삭제하면 된다.
#
# pkg <패키지 키> <파일명 접미사>
#   패키지 파일명 = CUBRID-<빌드 버전><접미사>
#   설치 방법은 접미사의 확장자로 정해진다: .sh / .tar.gz / .rpm
#   (파일명에 -debug. 이 있으면 debug 빌드로 보고 cubrid_rel이 debug build인지 확인)
#
# os <OS 키> <베이스 이미지:태그> [패키지 키 목록(콤마 구분)]
#   패키지 목록을 생략하면 위의 pkg 전체.
#   OS 계열(deb/rpm)은 러너가 베이스 이미지의 /etc/os-release(ID, ID_LIKE)로 자동 판별하고
#   계열별 공용 images/deb/Dockerfile, images/rpm/Dockerfile 을 쓴다.
#   debian/ubuntu 계열 -> deb, rhel/fedora/centos/rocky/ol/almalinux 계열 -> rpm.
#   그 밖의 OS는 판별 불가로 그 OS의 조합만 fail 하므로, 특수한 OS는 images/<OS 키>/Dockerfile 을 따로 만든다
#   (있으면 판별 없이 그것을 쓴다).
#
# 제외: 32bit(미지원), 컨테이너 이미지가 없는 배포판(ProLinux 등), Windows(별도 이슈)
#   수동 시험표(11.4 탭)의 CentOS 6.10 / 7.9 / 8.4 도 대상이 아니다. 대상 OS는 CUBRIDQA-1719에 정의한
#   아래 7종이고, CentOS는 EOL이다.

pkg  sh            -Linux.x86_64.sh
pkg  tar.gz        -Linux.x86_64.tar.gz
pkg  rpm           -Linux.x86_64.rpm
pkg  debug.sh      -Linux.x86_64-debug.sh
pkg  debug.tar.gz  -Linux.x86_64-debug.tar.gz

os   rocky8        rockylinux:8.9
os   rocky9        rockylinux:9.3
os   ubuntu24      ubuntu:24.04
os   debian12      debian:12.10
os   fedora42      fedora:42
# oraclelinux는 Docker Hub에 9.x 마이너 태그가 없어 9(현재 9.x 최신)를 사용
os   oracle9       oraclelinux:9
os   ubi9          redhat/ubi9:9.5
