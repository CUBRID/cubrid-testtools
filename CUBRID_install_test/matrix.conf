# CUBRID install test targets (OS x package)
#
# To add or remove an OS, add or delete one os line in this file.
#
# pkg <package key> <file name suffix>
#   package file name = CUBRID-<build version><suffix>
#   The install method is chosen by the suffix extension: .sh / .tar.gz / .rpm
#   (if the file name has -debug., it is treated as a debug build and cubrid_rel is checked for "debug build")
#
# os <OS key> <base image:tag> [package keys (comma separated)]
#   If the package list is omitted, all pkg entries above are used.
#   The runner detects the OS family (deb/rpm) from /etc/os-release (ID, ID_LIKE) of the base image
#   and uses the shared images/deb/Dockerfile or images/rpm/Dockerfile.
#   debian/ubuntu family -> deb, rhel/fedora/centos/rocky/ol/almalinux family -> rpm.
#   Any other OS cannot be detected and only that OS's combinations fail, so give a special OS its own images/<OS key>/Dockerfile
#   (when present, it is used without detection).
#
# Excluded: 32bit (not supported), distributions without a container image (ProLinux, etc.), Windows (separate issue)
#   CentOS 6.10 / 7.9 / 8.4 from the manual test sheet (11.4 tab) are not targets either. The target OSes are the
#   7 below, defined in CUBRIDQA-1719. CentOS is EOL.

pkg  sh            -Linux.x86_64.sh
pkg  tar.gz        -Linux.x86_64.tar.gz
pkg  rpm           -Linux.x86_64.rpm
pkg  debug.sh      -Linux.x86_64-debug.sh
pkg  debug.tar.gz  -Linux.x86_64-debug.tar.gz

os   rocky8        rockylinux:8.9
os   rocky9        rockylinux:9.3
os   ubuntu24      ubuntu:24.04
os   debian12      debian:12.10
os   fedora42      fedora:42
# oraclelinux has no 9.x minor tags on Docker Hub, so 9 (the latest 9.x) is used
os   oracle9       oraclelinux:9
os   ubi9          redhat/ubi9:9.5
